<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Equicord QuickCSS Editor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/editor/editor.main.css"
        integrity="sha256-tiJPQ2O04z/pZ/AwdyIghrOMzewf+PIvEl1YKbQvsZk=" crossorigin="anonymous"
        referrerpolicy="no-referrer">
    <style>
        html,
        body,
        #container {
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1e1e1e;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #title-bar {
            display: none;
        }

        @media all and (display-mode: window-controls-overlay) {
            #title-bar {
                display: flex;
                align-items: center;
                padding-left: 14px;
                font-family: Consolas, Courier New, monospace;
                line-height: 1;
                height: env(titlebar-area-height, 0px);
                app-region: drag;
                color: white;
            }
        }

        header {
            position: fixed;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #1e1e1e;
            color: #1e1e1e;
            border-bottom: 1px solid #444;
            width: 100%;
            z-index: 10;
        }

        #container {
            margin-top: 45px;
            background-color: #1e1e1e;
            border: 1px solid #1e1e1e;
        }

        .toolbar button:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <header>
        <div>
            <button id="selectAllButton"
                style="background: #1e1e1e; color: #ffffff; border: 1px solid transparent; padding: 5px 10px; margin-right: 5px; border-radius: 4px; transition: background 0.3s, border 0.3s;">Select
                All</button>
            <button id="saveButton"
                style="background: #1e1e1e; color: #ffffff; border: 1px solid transparent; padding: 5px 10px; margin-right: 5px; border-radius: 4px; transition: background 0.3s, border 0.3s;">Save</button>
            <button id="copyButton"
                style="background: #1e1e1e; color: #ffffff; border: 1px solid transparent; padding: 5px 10px; border-radius: 4px; transition: background 0.3s, border 0.3s;">Copy</button>
            <button id="undoButton"
                style="background: #1e1e1e; color: #ffffff; border: 1px solid transparent; padding: 5px 10px; border-radius: 4px; transition: background 0.3s, border 0.3s;">Undo</button>
            <button id="redoButton"
                style="background: #1e1e1e; color: #ffffff; border: 1px solid transparent; padding: 5px 10px; border-radius: 4px; transition: background 0.3s, border 0.3s;">Redo</button>
        </div>
    </header>
    <div id="title-bar">Equicord QuickCSS Editor</div>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/loader.js"
        integrity="sha256-KcU48TGr84r7unF7J5IgBo95aeVrEbrGe04S7TcFUjs=" crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>

    <script>
        require.config({
            paths: {
                vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs"
            }
        });

        /*
         * تُبنى الواجهة بعد قراءةٍ ناجحة **فقط**.
         *
         * 🔴 كان المحرّر يُفتَح بنصٍّ فارغ حين تفشل القراءة، فيُوهم صاحبه أنّ
         * ثيمه ضاع — ثمّ أوّل حرفٍ يكتبه يُحفَظ فوق الملفّ فيضيع فعلاً.
         */
        function showEditor(css) {
            const box = document.getElementById("container");
            box.style.cssText = "";
            box.replaceChildren();
            const editor = monaco.editor.create(box, {
                value: css,
                language: "css",
                theme: getTheme()
            });
            editor.onDidChangeModelContent(() => setCss(editor.getValue()));
            window.addEventListener("resize", () => editor.layout());
        }

        function showError(e) {
            const box = document.getElementById("container");
            box.style.cssText = "padding:24px;font:14px system-ui;color:#f2f3f5;line-height:1.8;background:#1e1e1e";

            const ar = document.createElement("p");
            ar.dir = "rtl";
            ar.textContent = "تعذّرت قراءة ملفّ التنسيقات، فلم يُفتَح المحرّر كي لا يُكتَب فوقه. "
                + "أغلق ما قد يمسك الملفّ (مضادّ فيروسات أو مزامنة سحابية) ثمّ أعد المحاولة.";
            const en = document.createElement("p");
            en.textContent = "QuickCSS could not be read, so the editor was not opened — that prevents it from "
                + "overwriting your file. Close whatever is holding the file (antivirus or cloud sync), then retry.";
            const detail = document.createElement("p");
            detail.style.cssText = "opacity:.65;font-family:ui-monospace,monospace;font-size:12px";
            detail.textContent = (e && e.message ? e.message : String(e));

            /*
             * 🔴 إعادةُ محاولةٍ **تعمل فعلاً**.
             *
             * `location.reload()` لا يُعيد تحميل عنوان `data:` — قِسته: تنجو
             * متغيّرات النافذة بعد الضغط، أي أن شيئاً لم يحدث. والضغط على زرّ
             * فتح المحرّر ثانيةً يجد النافذة قائمةً فيُظهرها كما هي. فالقراءة
             * تُعاد هنا مباشرةً.
             */
            const retry = document.createElement("button");
            retry.textContent = "إعادة المحاولة · Retry";
            retry.style.cssText = "margin-top:12px;padding:8px 18px;font:inherit;cursor:pointer;"
                + "border:1px solid #4e5058;border-radius:4px;background:#2b2d31;color:#f2f3f5";
            retry.onclick = () => {
                retry.disabled = true;
                retry.textContent = "…";
                load();
            };

            box.replaceChildren(ar, en, detail, retry);
        }

        function load() {
            getCurrentCss().then(showEditor).catch(showError);
        }

        require(["vs/editor/editor.main"], load);
    </script>
</body>

</html>
