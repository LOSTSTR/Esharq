name: Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ github.token }}
    EQUICORD_REMOTE: LOSTSTR/Esharq

permissions:
    contents: write
    actions: write

jobs:
    Validate:
        name: Validate Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint & type-check
              run: pnpm test

    Build:
        name: Build Equicord
        needs: Validate
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  mkdir -p dist/release
                  # Mirror Equicord's release: ALL top-level build outputs (desktop.asar for the
                  # HTTP updater + browser/equibop/userscript/extensions/JSONs/patcher). The installer
                  # is a separate repo (LOSTSTR/Esharq-Installer), like Equicord/Equilotl.
                  find dist -maxdepth 1 -type f -exec cp {} dist/release/ \;
                  find dist/release -size 0 -delete

            - name: Upload Equicord Stable
              if: ${{ vars.ACT != 'true' }}
              run: |
                  HASH=$(git rev-parse --short HEAD)
                  # Create the `v1.0.0-stable` release if it doesn't exist, then update its title
                  # to include the current commit hash. The HTTP updater reads the hash from
                  # the release name to decide whether a new update is available.
                  gh release create v1.0.0-stable \
                      --target main \
                      --title "Esharq $HASH" \
                      --notes "Official Release" 2>/dev/null || \
                  gh release edit v1.0.0-stable \
                      --title "Esharq $HASH" \
                      --notes "Official Release"
                  gh release upload v1.0.0-stable --clobber dist/release/*
