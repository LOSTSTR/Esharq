name: Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ github.token }}
    EQUICORD_REMOTE: LOSTSTR/Esharq

permissions:
    contents: write
    actions: write

jobs:
    Validate:
        name: Validate Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint & type-check
              run: pnpm test

    Build:
        name: Build Equicord
        needs: Validate
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  # Exact mirror of Equicord's release collect step (browser/desktop/equibop subdirs
                  # + top-level asars/zips/jsons + userscript). Installer is a separate repo.
                  cd dist
                  mkdir -p release

                  cp browser/browser.* release 2>/dev/null || true
                  cp Equicord.user.{js,js.LEGAL.txt} release 2>/dev/null || true

                  # plugin data jsons, extension zips, desktop/equibop asars
                  cp *.{json,zip,asar} release 2>/dev/null || true

                  # legacy un-asared files (desktop) + equibop files renamed with equibop prefix
                  cp desktop/* release 2>/dev/null || true
                  for file in equibop/*; do
                    [ -e "$file" ] || continue
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -size 0 -delete
                  rm -f release/package.json release/*.map

            - name: Upload Equicord Stable
              if: ${{ github.repository == 'LOSTSTR/Esharq' && vars.ACT != 'true' }}
              run: |
                  HASH=$(git rev-parse --short HEAD)
                  # Create the `v1.0.0-stable` release if it doesn't exist, then update its title
                  # to include the current commit hash. The HTTP updater reads the hash from
                  # the release name to decide whether a new update is available.
                  gh release create v1.0.0-stable \
                      --target main \
                      --title "Esharq $HASH" \
                      --notes "Official Release" 2>/dev/null || \
                  gh release edit v1.0.0-stable \
                      --title "Esharq $HASH" \
                      --notes "Official Release"
                  gh release upload v1.0.0-stable --clobber dist/release/*

            # ── Link to Esharq-Bored (like Equicord pushes plugin JSONs to Equibored) ──
            # يعمل على المستودع العام فقط — الخاص نسخة احتياطية لا تدفع إلى Esharq-Bored (ولا ETOKEN فيه).
            - name: Upload plugin JSONs to Esharq-Bored
              if: ${{ github.repository == 'LOSTSTR/Esharq' && vars.ACT != 'true' }}
              env:
                  REPO: LOSTSTR/Esharq-Bored
                  USERNAME: GitHub-Actions
                  ETOKEN: ${{ secrets.ETOKEN }}
              run: |
                  git config --global user.name "GitHub-Actions"
                  git config --global user.email actions@github.com
                  git clone https://$USERNAME:$ETOKEN@github.com/$REPO.git boredrepo
                  cd boredrepo
                  cp ../dist/release/*plugins.json . 2>/dev/null || true
                  cp ../dist/release/devs.json . 2>/dev/null || true
                  git add -A
                  git diff --staged --quiet || git commit -m "Plugins for https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
                  git push --force https://$USERNAME:$ETOKEN@github.com/$REPO.git
