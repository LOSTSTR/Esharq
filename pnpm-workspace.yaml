    "ip-address@<=10.1.0": ">=10.1.1"
    "dompurify@<3.3.2": ">=3.3.2"
    "fast-uri@<=3.1.0": ">=3.1.1"
    "fast-uri@<=3.1.1": ">=3.1.2"
    "basic-ftp@<=5.3.0": ">=5.3.1"

patchedDependencies:
    "@types/less@3.0.8": patches/@types__less@3.0.8.patch

peerDependencyRules:
    ignoreMissing:
        - eslint-plugin-import
        - eslint

allowedDeprecatedVersions:
    source-map-resolve: "*"
    resolve-url: "*"
    source-map-url: "*"
    urix: "*"
    q: "*"

strictPeerDependencies: false
pmOnFail: warn
verifyDepsBeforeRun: prompt
minimumReleaseAgeExclude:
  - '@song-spotlight/api@2.2.0'
